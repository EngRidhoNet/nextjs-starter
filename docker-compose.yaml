# ==============================================================================
# Docker Compose — Winsta AI Frontend
# ==============================================================================

services:
  # ============================================================================
  # Next.js App (Winsta AI Frontend)
  # ============================================================================
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
      args:
        APP_INTERNAL_PORT: ${APP_INTERNAL_PORT:-3000}
    image: engridhonet/winsta-ai-frontend:latest
    container_name: winsta-ai-frontend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${APP_PORT:-3000}:${APP_INTERNAL_PORT:-3000}"
    networks:
      - winsta_ai_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${APP_INTERNAL_PORT:-3000}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

# ==============================================================================
# Networks
# ==============================================================================
networks:
  winsta_ai_network:
    name: winsta_ai_network
    driver: bridge

